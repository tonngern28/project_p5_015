<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open House - ProfileCard</title>
  <link rel="stylesheet" href="profile_card.css">
  <link rel="stylesheet" href="colors.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app app--light">
    <header class="app__header">
      <h1>สมาชิกชมรม - Open House</h1>
      <button class="theme-toggle">🌙 โหมดมืด</button>
    </header>
    <div class="card-list">
      
    <div class="profile-card theme-light c-ff6b6b">
      <div class="profile-card__avatar">🎮</div>
      <h2 class="profile-card__name">สมชาย</h2>
      <p class="profile-card__role">หัวหน้าชมรม</p>
      <button class="profile-card__btn" data-name="สมชาย">ทักทาย</button>
    </div>
    

    <div class="profile-card theme-light c-4dabf7">
      <div class="profile-card__avatar">🎨</div>
      <h2 class="profile-card__name">สมหญิง</h2>
      <p class="profile-card__role">รองหัวหน้า</p>
      <button class="profile-card__btn" data-name="สมหญิง">ทักทาย</button>
    </div>
    

    <div class="profile-card theme-light c-51cf66">
      <div class="profile-card__avatar">📚</div>
      <h2 class="profile-card__name">ปราณี</h2>
      <p class="profile-card__role">เหรัญญิก</p>
      <button class="profile-card__btn" data-name="ปราณี">ทักทาย</button>
    </div>
    

    <div class="profile-card theme-light c-9775fa">
      <div class="profile-card__avatar">📸</div>
      <h2 class="profile-card__name">วิชัย</h2>
      <p class="profile-card__role">ฝ่ายประชาสัมพันธ์</p>
      <button class="profile-card__btn" data-name="วิชัย">ทักทาย</button>
    </div>
    
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
